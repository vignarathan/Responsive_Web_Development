		<!--contact form-->
		<div class="container">
			<div class="container">
			  <form class="row g-3" action="https://formspree.io/f/xaqlqkrp" method="POST">
				<div class="row g-3">
				  <div class="col">
					<input type="text" class="form-control" name="first_name" placeholder="First name" aria-label="First name">
				  </div>
				  <div class="col">
					<input type="text" class="form-control" name="last_name" placeholder="Last name" aria-label="Last name">
				  </div>
				</div>
				<div class="col-md-6">
				  <label for="inputEmail4" class="form-label">Email</label>
				  <input type="email" class="form-control" id="inputEmail4" name="email">
				</div>
				<div class="col-12">
				  <label for="inputAddress" class="form-label">Address</label>
				  <input type="text" class="form-control" id="inputAddress" name="address" placeholder="1234, Main Street">
				</div>
				<div class="col-md-6">
				  <label for="inputCity" class="form-label">City</label>
				  <input type="text" class="form-control" id="inputCity" name="city">
				</div>
				<div class="col-md-4">
				  <label for="inputState" class="form-label">District</label>
				  <select id="inputState" class="form-select" name="district">
					<option selected>Jaffna</option>
					<option>Colombo</option>
					<option>Kandy</option>
				  </select>
				</div>
				<div class="input-group">
				  <span class="input-group-text">Message</span>
				  <textarea class="form-control" name="message" aria-label="With textarea"></textarea>
				</div>
				<div class="col-12">
				  <button type="submit" class="btn btn-primary">Send Email</button>
				</div>
			  </form>
